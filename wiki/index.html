<link rel="stylesheet" id="gl-dark" href="https://0xd00d00.github.io/wiki-blog/giallo-dark.css">
<script>
(function(){var t="dark";try{if(localStorage.getItem("theme")==="light")t="light"}catch(e){}
document.documentElement.setAttribute("data-theme",t);
document.getElementById("gl-light").media=t==="light"?"all":"not all";
document.getElementById("gl-dark").media=t==="dark"?"all":"not all"})();
</script>

<body>
<div class="site">
  <header class="bar"><div class="wrap">
    <a class="brand" href="https://0xd00d00.github.io/wiki-blog/"><span class="mark" aria-hidden="true">[[]]</span><span><span class="nm">기억 보조용 위키</span><small>Zola + Vimwiki</small></span></a>
    <nav aria-label="주 메뉴">

      <a href="https://0xd00d00.github.io/wiki-blog/tags/" class="">태그</a>
      <a href="https://0xd00d00.github.io/wiki-blog/map/" class="">지도</a>
    </nav>
    <button type="button" class="search" id="searchBtn" aria-haspopup="dialog" aria-controls="sdlg"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="4.2"/><path d="m9.2 9.2 3.3 3.3"/></svg><span class="lbl">검색</span><span class="kbd">/</span></button>

      <button type="button" data-t="light" aria-pressed="false" aria-label="라이트 모드" title="라이트">☀️</button>
      <button type="button" data-t="dark" aria-pressed="true" aria-label="다크 모드" title="다크">🌙</button>
    </div>
  </div></header>

  <main class="wrap">
<h1></h1>
  </main>

  <footer class="status"><div class="wrap"><span>NORMAL  content/wiki/</span><span>utf-8  markdown</span></div></footer>
</div>
<dialog id="sdlg" aria-label="검색">
  <div class="sbox">
    <div class="sin">
      <svg width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="4.2"/><path d="m9.2 9.2 3.3 3.3"/></svg>
      <input id="sq" type="search" autocomplete="off" spellcheck="false" placeholder="문서 검색  (제목, 설명, #태그)" aria-label="검색어" aria-controls="sres">
      <button type="button" class="x" id="sclose" aria-label="닫기">Esc</button>
    </div>
    <div class="schips" id="schips"></div>
    <div class="sres" id="sres" role="listbox" aria-label="검색 결과"></div>
    <div class="sfoot"><span class="hint"><span class="kbd">↑</span><span class="kbd">↓</span>이동</span><span class="hint"><span class="kbd">Enter</span>열기</span><span class="hint"><span class="kbd">Esc</span>닫기</span><span class="cnt" id="scnt" aria-live="polite"></span></div>
  </div>
</dialog>
<script src="https://0xd00d00.github.io/wiki-blog/app.js" data-base="https://0xd00d00.github.io/wiki-blog/" defer></script>
